repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.2
    hooks:
      - id: pyupgrade
        args: ["--py310-plus"]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: \.(js|jsx)$
        types: [file]
        additional_dependencies: []

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types_or: [css, javascript, json]
        exclude: |
          (?x)^(
            sas_fortuna/fixtures/.*\.json
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: sas_fortuna/fixtures/.*\.json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.json$'

# Fixture JSON files are excluded from prettier/check-json reformatting on
# purpose: `bench export-fixtures` controls their exact formatting, and
# reformatting them separately just creates noisy, unreviewable diffs.

default_language_version:
  python: python3.11
